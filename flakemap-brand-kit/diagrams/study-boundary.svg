<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 440" role="img"><style>text{font-family:Manrope,system-ui,sans-serif;fill:#171E33;font-size:15px}.small{font-size:12px;fill:#526176}</style><rect width="760" height="440" rx="20" fill="#F7F8FA"/><title>Proposed replay study boundary</title><text x="32" y="38" font-size="22">A fixture-only evaluation boundary</text><text x="32" y="62" class="small">CONCEPT · No production connections</text><rect x="28" y="90" width="450" height="285" rx="20" fill="#E1EBE6" stroke="#526176" stroke-dasharray="6 6"/><text x="48" y="120" class="small">INSIDE / PROPOSED STUDY</text><rect x="48" y="140" width="410" height="60" rx="10" fill="white" stroke="#CBD4E0"/><text x="65" y="165">Approved fixture</text><text x="65" y="186" class="small">Redacted, consented source</text><rect x="48" y="212" width="410" height="60" rx="10" fill="white" stroke="#CBD4E0"/><text x="65" y="237">Stub tools → seeded replay</text><text x="65" y="258" class="small">Timeout / delay / stale response</text><rect x="48" y="284" width="410" height="60" rx="10" fill="white" stroke="#CBD4E0"/><text x="65" y="309">Human review → mock report</text><text x="65" y="330" class="small">Artifact criterion and rationale</text><path d="M480 240H530" stroke="#A6502A" stroke-dasharray="5 5"/><path d="m525 235 7 5-7 5" fill="none" stroke="#A6502A"/><rect x="540" y="150" width="190" height="180" rx="12" fill="white" stroke="#CBD4E0"/><text x="558" y="178">Excluded</text><text x="558" y="211" class="small">Production calls</text><text x="558" y="237" class="small">Secrets / raw traces</text><text x="558" y="263" class="small">Billing / external writes</text><text x="558" y="299" class="small">Outside study scope</text><text x="32" y="413" class="small">Mock reports do not connect to or change a real release gate.</text></svg>