<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 310" role="img" aria-labelledby="dt dd"><title id="dt">PO-204 timeout and duplicate draft</title><desc id="dd">Stock API timeout leads to a retry draft. A late original response creates a second draft in the candidate. Baseline deduplication suppresses the late draft.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 10 5 0 10" fill="#526176"/></marker></defs><g fill="none" stroke="#526176" stroke-width="1.5" marker-end="url(#arrow)"><path d="M185 150H235"/><path d="M405 150H450V70H500"/><path d="M405 150H450V230H500"/><path d="M665 70H725"/><path d="M665 230H725"/></g><g fill="#FFFFFF" stroke="#CBD4E0"><rect x="20" y="112" width="165" height="76" rx="12"/><rect x="235" y="112" width="170" height="76" rx="12"/><rect x="500" y="32" width="165" height="76" rx="12"/><rect x="500" y="192" width="165" height="76" rx="12"/><rect x="725" y="32" width="155" height="76" rx="12"/><rect x="725" y="192" width="155" height="76" rx="12"/></g><g font-family="Manrope, sans-serif" font-size="14" fill="#171E33" text-anchor="middle"><text x="102" y="143">Order lookup</text><text x="102" y="166" fill="#526176">PO-204</text><text x="320" y="143">Stock check</text><text x="320" y="166" fill="#A6502A">Injected timeout</text><text x="582" y="63">Retry succeeds</text><text x="582" y="86" fill="#526176">First draft</text><text x="582" y="223">Late response</text><text x="582" y="246" fill="#526176">Original call returns</text><text x="802" y="63">PO-204-A</text><text x="802" y="86" fill="#226747">1 draft created</text><text x="802" y="223">PO-204-B</text><text x="802" y="246" fill="#A13252">Duplicate in candidate</text></g><text x="20" y="300" font-family="Manrope,sans-serif" font-size="12" fill="#526176">DEMO · SYNTHETIC DATA · CONCEPT PREVIEW</text></svg>