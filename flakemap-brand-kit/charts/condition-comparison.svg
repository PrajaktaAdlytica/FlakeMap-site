<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" role="img" aria-label="Condition comparison chart"><title>Condition comparison chart</title><desc>Baseline meets the criterion in all eight synthetic runs. Candidate meets it in eight normal, six timeout and seven delayed runs.</desc><style>text{font-family:Manrope,system-ui,sans-serif;fill:#171E33;font-size:14px}.small{font-size:12px;fill:#526176}</style><text x="28" y="32" font-size="20">Exactly-one-draft criterion, by condition</text><text x="28" y="56" class="small">DEMO · SYNTHETIC DATA · 8 fixed seeded runs per condition</text><text x="28" y="117">Normal</text><rect x="170" y="95" width="500" height="18" rx="4" fill="#CBD4E0"/><rect x="170" y="95" width="500" height="18" rx="4" fill="#526176"/><text x="690" y="110" class="small">Baseline 8/8</text><rect x="170" y="121" width="500" height="18" rx="4" fill="#EEF2F7"/><rect x="170" y="121" width="500.0" height="18" rx="4" fill="#77516F"/><text x="690" y="136" class="small">Candidate 8/8</text><text x="28" y="207">Timeout</text><rect x="170" y="185" width="500" height="18" rx="4" fill="#CBD4E0"/><rect x="170" y="185" width="500" height="18" rx="4" fill="#526176"/><text x="690" y="200" class="small">Baseline 8/8</text><rect x="170" y="211" width="500" height="18" rx="4" fill="#EEF2F7"/><rect x="170" y="211" width="375.0" height="18" rx="4" fill="#77516F"/><text x="690" y="226" class="small">Candidate 6/8</text><text x="28" y="297">Delay</text><rect x="170" y="275" width="500" height="18" rx="4" fill="#CBD4E0"/><rect x="170" y="275" width="500" height="18" rx="4" fill="#526176"/><text x="690" y="290" class="small">Baseline 8/8</text><rect x="170" y="301" width="500" height="18" rx="4" fill="#EEF2F7"/><rect x="170" y="301" width="437.5" height="18" rx="4" fill="#77516F"/><text x="690" y="316" class="small">Candidate 7/8</text><text x="170" y="370" class="small">0</text><text x="660" y="370" class="small">8 runs</text><text x="28" y="395" class="small">Illu