<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 460" role="img" aria-labelledby="ft fd"><title id="ft">Evaluation engineer demo journey</title><desc id="fd">Open synthetic demo, choose scenario and seed, inject fault, compare artifacts, adjudicate. A failed criterion produces a mock blocked report; a passing criterion produces a mock eligible report. No real CI action occurs.</desc><defs><marker id="fa" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto" viewBox="0 0 10 10"><path d="M0 0 10 5 0 10" fill="#526176"/></marker></defs><g fill="none" stroke="#526176" stroke-width="1.5" marker-end="url(#fa)"><path d="M180 55H230"/><path d="M410 55H460"/><path d="M640 55H690"/><path d="M790 90V200H555"/><path d="M360 200H305"/><path d="M195 265V345H355"/><path d="M195 265V390H640"/></g><g fill="#FFF" stroke="#CBD4E0"><rect x="20" y="20" width="160" height="70" rx="12"/><rect x="230" y="20" width="180" height="70" rx="12"/><rect x="460" y="20" width="180" height="70" rx="12"/><rect x="690" y="20" width="200" height="70" rx="12"/><rect x="360" y="165" width="195" height="70" rx="12"/><path d="m195 135 110 65-110 65-110-65Z"/><rect x="355" y="315" width="200" height="60" rx="12"/><rect x="640" y="360" width="250" height="60" rx="12"/></g><g fill="#171E33" font-family="Manrope,sans-serif" font-size="14" text-anchor="middle"><text x="100" y="60">Open demo</text><text x="320" y="50">Choose scenario</text><text x="320" y="72">and run seed</text><text x="550" y="60">Inject tool fault</text><text x="790" y="50">Compare versions</text><text x="790" y="72">and task artifacts</text><text x="457" y="193">Human adjudication</text><text x="457" y="215">Evidence + rationale</text><text x="195" y="194">Criterion</text><text x="195" y="216">met?</text><text x="455" y="351" fill="#A13252">No → Mock blocked report</text><text x="765" y="396" fill="#226747">Yes → Mock eligible report</text></g><text x="20" y="450" font-family="Manrope,sans-serif" font-size="12" fill="#526176">DEMO · SYNTHETIC DATA · No external CI writes</text></svg>